name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
      - "server/**"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: FastAPI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install server dependencies
        run: python -m pip install --disable-pip-version-check -r server/requirements-dev.txt
      - name: Run server tests
        env:
          PYTHONPATH: server
        run: python -m unittest discover -s server/tests -v

  ios-build:
    name: Test and build unsigned IPA
    needs: server-tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build, test, and package IPA
        run: bash ios/scripts/build_unsigned_ipa.sh
      - name: Upload IPA and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-v4-ios-build
          if-no-files-found: error
          retention-days: 14
          path: |
            ios/output/VideoDownloader-v4-unsigned.ipa
            ios/output/VideoDownloader-v4-unsigned.ipa.sha256
            ios/build/logs/
